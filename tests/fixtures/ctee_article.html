  <h1>亞資高雄專區試辦業務展延　金管會三叮囑</h1>
  <p>金管會15日宣布，亞洲資產管理中心高雄專區試辦業務展延一年，並對參與的金控與銀行提出三項叮囑，要求強化風險控管與人才培育。</p>
  <p>金管會主委彭金隆表示，高雄專區推動至今已有多家業者進駐，未來將持續檢視試辦成效，適時研議法規鬆綁。</p>
