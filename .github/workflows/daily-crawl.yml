name: 每日爬蟲

on:
  schedule:
    # 台灣時間每天 08:00（UTC 00:00）；GitHub cron 可能延遲數分鐘到數十分鐘
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      terms:
        description: "只搜尋指定關鍵字（空白分隔，留空＝全部）"
        required: false
        default: ""

permissions:
  contents: write

# 與審核套用、報告生成共用同一組，避免同時寫入資料庫造成 push 衝突
concurrency:
  group: newsfetch-data
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 執行爬蟲
        id: crawl
        env:
          TERMS: ${{ github.event.inputs.terms }}
        run: |
          if [ -n "$TERMS" ]; then
            python run_daily.py --terms $TERMS
          else
            python run_daily.py
          fi

      - name: Commit 資料與執行報告
        run: bash scripts/commit_data.sh "每日爬蟲 $(TZ=Asia/Taipei date +%F)"

      # 爬蟲成功或失敗都寄出通知；未設定 SMTP 相關 Secrets 時自動略過
      - name: Email 通知
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          CRAWL_OUTCOME: ${{ steps.crawl.outcome }}
        run: |
          if [ "$CRAWL_OUTCOME" = "success" ]; then
            python notify.py
          else
            python notify.py --status failure
          fi
