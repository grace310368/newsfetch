<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EEE4">
<title>新聞觀測站｜金融政策彙整</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="header" id="header">
    <div class="brand-c">
      <span class="vert">BANK<br>SINOPAC</span>
      <p class="name">新聞觀測站<em>金融政策彙整</em></p>
    </div>
    <div class="search-bar" id="search-bar" hidden>
      <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6.5"/><line x1="19" y1="19" x2="14.7" y2="14.7"/></svg></span>
      <input id="search-input" type="search" placeholder="搜尋關鍵字，如：TISA、彭金隆" autocomplete="off" aria-label="搜尋新聞">
    </div>
  </header>

  <main class="content" id="view"><div class="loading">資料載入中…</div></main>

  <nav class="bottom-nav" id="nav">
    <button class="nav-item" data-action="nav" data-view="date"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><line x1="3.5" y1="9.5" x2="20.5" y2="9.5"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg></span>日期</button>
    <button class="nav-item" data-action="nav" data-view="topic"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4h-5.5a1.5 1.5 0 0 0 -1.5 1.5v5.5c0 .4 .15 .78 .44 1.06l8 8c.58 .58 1.53 .58 2.12 0l6-6c.58 -.58 .58 -1.53 0 -2.12l-8 -8c-.28 -.28 -.66 -.44 -1.06 -.44z"/><circle cx="9" cy="9" r="1"/></svg></span>議題</button>
    <button class="nav-item" data-action="nav" data-view="trend"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 16 9.5 10.5 13.5 14.5 20 8"/><polyline points="15 8 20 8 20 13"/></svg></span>趨勢</button>
    <button class="nav-item" data-action="nav" data-view="review"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3l8 -8"/><path d="M20 12v6a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h9"/></svg></span>待審核<span class="nav-badge" id="nav-badge" hidden></span></button>
  </nav>
</div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
